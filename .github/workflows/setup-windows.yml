# Builds the Windows installer of the Setup app.
# A published release starts it, and the .exe is attached to that release (the download page links to it).
# Run by hand (Actions > Build Setup (Windows) > Run workflow), the .exe is only a run artifact (Summary > Artifacts).
name: Build Setup (Windows)
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: write # upload the .exe to the release
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: setup
    steps:
      - run: git config --global core.autocrlf false # Kindle scripts keep LF (see .gitattributes)
        working-directory: .
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24 # npm 11, like the machine that wrote package-lock.json
      # npm install, not npm ci: on Windows npm adds packages that a lock file written on macOS leaves out
      # (electron-builder-squirrel-windows, a peer dependency of electron-builder). It also installs the
      # Windows builds of esbuild and workerd.
      - run: npm install --no-audit --no-fund
      - run: npm test # also checks that no Kindle file has CRLF
      - run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v5
        with:
          name: kid-planner-setup-windows
          path: setup/dist/*.exe
          if-no-files-found: error
      - if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" dist/KidPlannerSetup-windows.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}
